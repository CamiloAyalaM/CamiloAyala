name: n8n-gitops-sync

on:
  push:
    branches:
      - main
    paths:
      - 'workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Axios
        run: npm install axios

      - name: Sync logic
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          node -e "
          const axios = require('axios');
          const fs = require('fs');
          const path = require('path');

          async function start() {
            const url = process.env.N8N_URL.trim().replace(/\/$/, '');
            const api = axios.create({
              baseURL: \`\${url}/api/v1\`,
              headers: { 'X-N8N-API-KEY': process.env.N8N_API_KEY.trim() }
            });

            try {
              const dir = path.join(process.cwd(), 'workflows');
              if (!fs.existsSync(dir)) {
                console.log('No workflows directory found. Skipping.');
                return;
              }
              const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
              const localWorkflows = files.map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf-8')));

              const { data: remoteRes } = await api.get('/workflows');
              const remoteWorkflows = remoteRes.data;

              for (const local of localWorkflows) {
                const existing = remoteWorkflows.find(r => r.name === local.name);
                
                // Extraemos el estado pero NO lo enviamos en el body principal (Error 400 fix)
                const shouldBeActive = local.active === true;
                const body = {
                  name: local.name,
                  nodes: local.nodes,
                  connections: local.connections,
                  settings: local.settings,
                  staticData: local.staticData
                };

                let workflowId;

                if (existing) {
                  await api.put('/workflows/' + existing.id, body);
                  workflowId = existing.id;
                  console.log('✅ Updated: ' + local.name);
                } else {
                  const created = await api.post('/workflows', body);
                  workflowId = created.data.id;
                  console.log('✨ Created: ' + local.name);
                }

                // Sincronización del estado Active/Inactive
                try {
                  const action = shouldBeActive ? 'activate' : 'deactivate';
                  await api.post(\`/workflows/\${workflowId}/\${action}\`);
                  console.log(\`  -> Status: \${action}\`);
                } catch (statusErr) {
                  console.log(\`  ⚠️ Could not change status for \${local.name}: \`, statusErr.response?.data?.message || statusErr.message);
                }
              }

              for (const remote of remoteWorkflows) {
                if (!localWorkflows.some(l => l.name === remote.name)) {
                  await api.delete('/workflows/' + remote.id);
                  console.log('🗑️ Deleted: ' + remote.name);
                }
              }
            } catch (e) {
              console.error('❌ Error:', e.response?.data || e.message);
              process.exit(1);
            }
          }
          start();
          "
