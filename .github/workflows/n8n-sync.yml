name: n8n-gitops-sync

on:
  push:
    branches:
      - main
      - claude/n8n-automation-Vv3sM
    paths:
      - 'workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Axios
        run: npm install axios

      - name: Sync logic
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          node -e "
          const axios = require('axios');
          const fs = require('fs');
          const path = require('path');

          async function start() {
            const url = process.env.N8N_URL.trim().replace(/\/$/, '');
            const api = axios.create({
              baseURL: \`\${url}/api/v1\`,
              headers: { 
                'X-N8N-API-KEY': process.env.N8N_API_KEY.trim(),
                'Content-Type': 'application/json'
              }
            });

            try {
              const dir = path.join(process.cwd(), 'workflows');
              if (!fs.existsSync(dir)) return console.log('No workflows folder found.');
              
              const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
              const localWorkflows = files.map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf-8')));

              const { data: remoteRes } = await api.get('/workflows');
              const remoteWorkflows = remoteRes.data;

              for (const local of localWorkflows) {
                const existing = remoteWorkflows.find(r => r.name === local.name);
                
                const body = {
                  name: local.name,
                  nodes: local.nodes,
                  connections: local.connections,
                  settings: {},
                  staticData: null
                };

                // DEBUG: log exact body being sent
                console.log('--- Sending body for: ' + local.name);
                console.log(JSON.stringify(body, null, 2).substring(0, 500));

                let workflowId;
                if (existing) {
                  // WORKAROUND: Delete + Create instead of PUT (avoids n8n API validation bug)
                  console.log('  🗑️ Deleting existing to recreate: ' + existing.id);
                  await api.delete('/workflows/' + existing.id);
                  const created = await api.post('/workflows', body);
                  workflowId = created.data.id;
                  console.log('✅ Recreado: ' + local.name + ' (id: ' + workflowId + ')');
                } else {
                  const created = await api.post('/workflows', body);
                  workflowId = created.data.id;
                  console.log('✨ Creado: ' + local.name + ' (id: ' + workflowId + ')');
                }

                // Activar segun estado en Git
                if (local.active === true) {
                  await api.post(\`/workflows/\${workflowId}/activate\`)
                    .then(() => console.log('  ⚡ Activado'))
                    .catch(e => console.log('  ⚠️ No se pudo activar: ' + (e.response?.data?.message || e.message)));
                }
              }

              console.log('🎉 Sync completado exitosamente.');
            } catch (e) {
              console.error('❌ API Error:', e.response?.data || e.message);
              if (e.response?.config) {
                console.error('Request URL:', e.response.config.url);
                console.error('Request data:', e.response.config.data?.substring(0, 1000));
              }
              process.exit(1);
            }
          }
          start();
          "
