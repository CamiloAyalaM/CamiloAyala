const axios = require('axios');
          const fs = require('fs');
          const path = require('path');

          // Limpieza de URL y Key para evitar errores de formato
          const rawUrl = process.env.N8N_URL || '';
          const cleanUrl = rawUrl.trim().replace(/\/$/, ''); 
          
          const api = axios.create({
            baseURL: `${cleanUrl}/api/v1`,
            headers: { 
              'X-N8N-API-KEY': process.env.N8N_API_KEY.trim(),
              'Content-Type': 'application/json'
            }
          });

          async function startSync() {
            console.log(`🚀 Conectando a: ${cleanUrl}...`);
            try {
              // 1. Cargar locales desde la carpeta /workflows
              const dir = path.join(process.cwd(), 'workflows');
              if (!fs.existsSync(dir)) throw new Error('No se encuentra la carpeta /workflows');
              
              const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
              const localWorkflows = files.map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf-8')));

              // 2. Obtener remotos
              const { data: response } = await api.get('/workflows');
              const remoteWorkflows = response.data;

              console.log('--- Resumen de Sincronización ---');

              // 3. UPSERT
              for (const local of localWorkflows) {
                const existing = remoteWorkflows.find(r => r.name === local.name);
                const payload = {
                  name: local.name,
                  nodes: local.nodes,
                  connections: local.connections,
                  settings: local.settings,
                  staticData: local.staticData,
                  active: local.active === true
                };

                if (existing) {
                  await api.put(`/workflows/${existing.id}`, payload);
                  console.log(`✅ Actualizado: ${local.name}`);
                } else {
                  await api.post('/workflows', payload);
                  console.log(`✨ Creado: ${local.name}`);
                }
              }

              // 4. PRUNE
              for (const remote of remoteWorkflows) {
                if (!localWorkflows.some(l => l.name === remote.name)) {
                  await api.delete(`/workflows/${remote.id}`);
                  console.log(`🗑️ Eliminado de n8n: ${remote.name} (No existe en Git)`);
                }
              }
            } catch (err) {
              console.error('❌ Error de conexión o API:', err.response?.data || err.message);
              process.exit(1);
            }
          }
          startSync();
